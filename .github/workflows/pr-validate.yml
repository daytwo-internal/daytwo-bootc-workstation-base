name: PR Validation

# Validates pull requests. Never logs in to ghcr.io and never pushes an
# image — publishing only happens from build.yml on main.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'rootfs/**'
      - 'build.d/**'
      - '.github/workflows/pr-validate.yml'
      - '**/*.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ShellCheck build.d/*.sh
        run: shellcheck build.d/*.sh

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Hadolint Containerfile
        run: |
          docker run --rm -i \
            docker.io/hadolint/hadolint@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            < Containerfile

  # Skipped for PRs from forks: forks never receive repository secrets on the
  # `pull_request` trigger, so there is no RHEL entitlement to pull the base
  # image or run subscription-manager. See the "summary" job below for what
  # that means for a fork contributor's PR.
  build-and-lint:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # GitHub-hosted runners only have ~14GB free. A RHEL Workstation image
      # with all our DevOps tooling needs more than that to commit the layer.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Install podman 5.x
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Log in to registry.redhat.io (pull base image)
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
        run: |
          echo "${REGISTRY_PASSWORD}" | podman login registry.redhat.io \
            -u '${{ secrets.REGISTRY_REDHAT_IO_USER }}' \
            --password-stdin

      - name: Build image (not pushed)
        env:
          RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
          RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
        run: |
          printf '%s' "$RHSM_ACTIVATION_KEY" > activation_key.txt
          printf '%s' "$RHSM_ORG_ID" > org_id.txt

          podman build \
            --secret id=activation_key,src=activation_key.txt \
            --secret id=org_id,src=org_id.txt \
            --tag pr-validate:${{ github.sha }} \
            .

      - name: Wipe secret files
        if: always()
        run: |
          shred -u activation_key.txt org_id.txt 2>/dev/null || \
            rm -f activation_key.txt org_id.txt

      - name: bootc container lint
        run: |
          # sysusers/var-tmpfiles are upstream RPM packaging gaps (users and
          # /var content created without systemd sysusers.d/tmpfiles.d
          # entries) that can't be fixed from this repo. Everything else is
          # fatal.
          podman run --rm "pr-validate:${{ github.sha }}" \
            bootc container lint --fatal-warnings \
              --skip sysusers --skip var-tmpfiles

  summary:
    needs: [shellcheck, hadolint, build-and-lint]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Note skipped checks
        run: |
          if [ "${{ needs.build-and-lint.result }}" = "skipped" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Full image build skipped

          This PR comes from a fork, so repository secrets (RHEL entitlement,
          registry.redhat.io credentials) are not available to it. The full
          `podman build` and `bootc container lint --fatal-warnings` checks
          could not run.

          ShellCheck and Hadolint (static checks that need no RHEL
          subscription) still ran above. A maintainer must either push this
          branch to the main repository or re-run this workflow manually
          (`workflow_dispatch`) after reviewing the diff to get full build
          validation.
          EOF
          fi

      - name: Fail if any required check failed
        run: |
          for result in \
            "${{ needs.shellcheck.result }}" \
            "${{ needs.hadolint.result }}" \
            "${{ needs.build-and-lint.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::a required PR check did not succeed"
              exit 1
            fi
          done
