name: Build and Push (base image)

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'rootfs/**'
      - 'build.d/**'
      - '.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: daytwo-internal
  IMAGE_NAME: daytwo-bootc-workstation-base

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # GitHub-hosted runners only have ~14GB free. A RHEL Workstation image
      # with all our DevOps tooling needs more than that to commit the layer.
      # This frees ~30GB by removing pre-installed software we don't use.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Install podman 5.x
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Log in to registry.redhat.io (pull base image)
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
        run: |
          echo "${REGISTRY_PASSWORD}" | podman login registry.redhat.io \
            -u '${{ secrets.REGISTRY_REDHAT_IO_USER }}' \
            --password-stdin

      - name: Log in to ghcr.io (push built image)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE_FQN="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE_TAG="$(date -u +%Y%m%d)"
          # Date + short SHA so two builds on the same day never overwrite each other.
          DATED_TAG="${DATE_TAG}-${SHORT_SHA}"

          {
            echo "image_fqn=${IMAGE_FQN}"
            echo "short_sha=${SHORT_SHA}"
            echo "dated_tag=${DATED_TAG}"
          } >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "push_testing=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_testing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        env:
          RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
          RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
          IMAGE_FQN: ${{ steps.tags.outputs.image_fqn }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          DATED_TAG: ${{ steps.tags.outputs.dated_tag }}
        run: |
          # Write secrets to disk so podman build --secret can mount them.
          # We delete them in the always() step regardless of build outcome.
          printf '%s' "$RHSM_ACTIVATION_KEY" > activation_key.txt
          printf '%s' "$RHSM_ORG_ID" > org_id.txt

          podman build \
            --secret id=activation_key,src=activation_key.txt \
            --secret id=org_id,src=org_id.txt \
            --tag "${IMAGE_FQN}:${SHORT_SHA}" \
            --tag "${IMAGE_FQN}:${DATED_TAG}" \
            .

      - name: Wipe secret files
        if: always()
        run: |
          shred -u activation_key.txt org_id.txt 2>/dev/null || \
            rm -f activation_key.txt org_id.txt

      - name: Inspect image
        env:
          IMAGE_FQN: ${{ steps.tags.outputs.image_fqn }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          podman image inspect "${IMAGE_FQN}:${SHORT_SHA}" \
            --format '{{ .Size }} bytes — {{ .Created }}'
          podman image tree "${IMAGE_FQN}:${SHORT_SHA}" || true

      - name: Push tags
        id: push
        env:
          IMAGE_FQN: ${{ steps.tags.outputs.image_fqn }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          DATED_TAG: ${{ steps.tags.outputs.dated_tag }}
          PUSH_TESTING: ${{ steps.tags.outputs.push_testing }}
        run: |
          podman push --digestfile digest.txt "${IMAGE_FQN}:${SHORT_SHA}"
          podman push "${IMAGE_FQN}:${DATED_TAG}"

          if [ "${PUSH_TESTING}" = "true" ]; then
            podman tag "${IMAGE_FQN}:${SHORT_SHA}" "${IMAGE_FQN}:testing"
            podman push "${IMAGE_FQN}:testing"
          fi

          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (keyless, by digest)
        env:
          IMAGE_FQN: ${{ steps.tags.outputs.image_fqn }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_FQN}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.tags.outputs.image_fqn }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM (associated with the published digest)
        id: attest-sbom
        continue-on-error: true
        env:
          IMAGE_FQN: ${{ steps.tags.outputs.image_fqn }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # This Workstation image's SBOM regularly exceeds the 16MB predicate
          # size limit of GitHub's native attest-sbom action (which stores
          # attestations via the GitHub API), so we use cosign attest instead,
          # which pushes the attestation straight to the registry as an OCI
          # artifact. That still routes through the public Rekor transparency
          # log, which has its own undocumented request-body-size limit
          # (https://github.com/sigstore/rekor/issues/2808) that this SBOM
          # can also exceed. Best-effort: don't fail the whole publish over
          # it, since the signature (mandatory) and provenance are unaffected.
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE_FQN}@${DIGEST}"

      - name: Note SBOM attestation failure
        if: steps.attest-sbom.outcome == 'failure'
        run: |
          echo "::warning::SBOM attestation failed (likely Rekor's undocumented size limit for this image's SBOM) — signature and provenance are unaffected. See job logs for the 'Attest SBOM' step." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (associated with the published digest)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.tags.outputs.image_fqn }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Trigger derivative rebuilds
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DERIVATIVE_DISPATCH_TOKEN }}
        run: |
          # Optional: notify each derivative repo so it rebuilds with the new
          # base. Requires a PAT with `repo` scope stored as
          # DERIVATIVE_DISPATCH_TOKEN. If unset, this step is a no-op.
          if [ -z "${GH_TOKEN}" ]; then
            echo "DERIVATIVE_DISPATCH_TOKEN not set — skipping cascade"
            exit 0
          fi
          for repo in \
              daytwo/rhel10-bootc-workstation-rarguello \
              ; do
            echo "Dispatching base-updated event to ${repo}"
            curl -fsSL \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repo}/dispatches" \
              -d '{"event_type":"base-updated"}' || \
              echo "  ↳ failed to dispatch to ${repo} (continuing)"
          done
